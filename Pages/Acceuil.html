<html lang="fr">

  <head>

    <link rel="stylesheet" href="../assets/style.css">

  <body>
    <header>
        <div class="BoxBigLogo">
        <img src="../Images/LogoHead.png" alt="ImageHead" class="LogoHead">
        </div>
        <div class="Descendre">     </div>
    </header>
    <nav class="navBar">
    <div class="LogoNav">
        <img src="../Images/LogoNav1.png" class="LogoNav1" alt="LittleLogo">
        <img src="../Images/LogoNav2.png" class="LogoNav2">
    </div>
    <div class="links">
        <a href="#" class="active">Accueil</a>
        <a href="Offres.html">Offre</a>

    </nav>
    

    <main>
        <h1> Bienvenue Chez nous</h1>
        <!--mettre le caroussel ici-->

        <h2>Rechercher une offre ou une entreprise :</h2>
        <div class="truc">
        <div class="dropdown">
            <div class = "dropbtn">Contrat</div>
            <div class="dropdown-content">
                <button>Stage</button>
                <button>Alternance</button>
                <button>CDI</button>
                <button>CDD</button>
                <button>Emploi saisonnier</button>
                <button>Contrat étudiant</button>
            </div>
        </div>

        <div class="dropdown">
            <div class = "dropbtn">Domaine</div>
            <div class="dropdown-content">
                <button>Informatique</button>
                <button>BTP</button>
                <button>Finance</button>
                <button>Artisanat</button>
            </div>
        </div>

        <div class="dropdown">
            <div class = "dropbtn">Compétence</div>
            <div class="dropdown-content">
                <button>Langues</button>
                <button>CSS</button>
                <button>HTML</button>
                <button>Javascript</button>
                <button>Python</button>
                <button>Machine Learning</button>
            </div>
        </div>

        <br><br>
        <label for="ville">Ville :</label>
        <input list="villes" id="ville" name="ville" placeholder="Commencez à taper...">
        <datalist id="villes">
            <option value="Bordeaux">
            <option value="Bruxelles">
            <option value="Brest">
            <option value="Lyon">
            <option value="Paris">
        </datalist>

<!--        Rechercher une entreprise-->
        <br><br>
        <label for="ville">Entreprise :</label>
        <input list="entreprises" id="entreprise" name="entreprise" placeholder="Commencez à taper...">
        <datalist id="entreprises">
            <option value="A">
            <option value="B">
            <option value="C">
            <option value="D">
            <option value="E">
        </datalist>

        <br><br> <!--enlever les br après-->
        <form action="../Pages/Offres.html" method="get">
        <button type="submit" >Rechercher</button>
        </form>
        <button>Réinitialiser</button>
        </div>

    </main>

    <footer>
