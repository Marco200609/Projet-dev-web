        <form action="Pages/Offres.html" method="get" class="truc">

            <label for="nomOffre">Nom de l'offre :</label>
            <input list="nomOffres" id="nomOffre" name="nomOffre" placeholder="Commencez à taper...">
            <datalist id="nomOffres">

                <option value="test1">
            </datalist>

            <br>

            <div class="dropdown">

                <button type="button">Informatique</button>

                <button type="button">Finance</button>

            </div>
        </div>

        <div class="dropdown">
            <div class = "dropbtn">Compétence</div>

                <button type="button">Javascript</button>
                <button type="button">Python</button>
                <button type="button">Machine Learning</button>

        </div>

        <br><br>
        <label for="ville">Ville :</label>

            <option value="Bordeaux">
            <option value="Bruxelles">
            <option value="Brest">
            <option value="Lyon">
            <option value="Paris">
        </datalist>

<!--        Rechercher une entreprise-->
        <br><br>
        <label for="ville">Entreprise :</label>
        <input list="entreprises" id="entreprise" name="entreprise" placeholder="Commencez à taper...">
        <datalist id="entreprises">
            <option value="A">
            <option value="B">
            <option value="C">
            <option value="D">
            <option value="E">
        </datalist>

        <br><br> <!--enlever les br après-->
        <button type="submit" >Rechercher</button>
        <button type="reset">Réinitialiser</button>
